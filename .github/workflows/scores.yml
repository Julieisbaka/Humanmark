name: Refresh model scores

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  sync-scores:
    runs-on: ubuntu-latest

    env:
      ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'dev-requirements.txt'

      - name: Install benchmark tooling
        run: python -m pip install --upgrade pip && pip install -r dev-requirements.txt

      - name: Refresh model scores
        run: python scripts/sync_scores.py

      - name: Generate AI changelog
        run: python scripts/generate_changelog.py --days 7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/changelog.json
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "chore: update AI changelog [skip ci]"
            git push origin HEAD
          fi
