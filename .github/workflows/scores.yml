name: Refresh model scores

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-scores:
    runs-on: ubuntu-latest

    env:
      ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'dev-requirements.txt'

      - name: Install benchmark tooling
        run: python -m pip install --upgrade pip && pip install -r dev-requirements.txt

      - name: Refresh model scores
        run: python scripts/sync_scores.py

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R src/. dist/
          cp -R data dist/
          cp robots.txt dist/
          cp sitemap.xml dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-scores
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

