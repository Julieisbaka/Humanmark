name: Refresh model scores

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  sync-scores:
    runs-on: ubuntu-latest

    env:
      ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark tooling
        run: python -m pip install --upgrade pip && pip install -r dev-requirements.txt

      - name: Refresh model scores
        run: python scripts/sync_scores.py

