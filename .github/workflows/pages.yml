name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 18 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '#Force-update-pages') || contains(toJson(github.event.commits), '#Force-update-pages')
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'dev-requirements.txt'

      - name: Install benchmark tooling
        run: python -m pip install --upgrade pip && pip install -r dev-requirements.txt

      - name: Refresh benchmark data for the site build
        run: |
          python scripts/benchmark.py Idavidrein/gpqa --task gpqa_diamond --split train --output data/benchmarks/generated/gpqa_diamond.json
          python scripts/benchmark.py TIGER-Lab/MMLU-Pro --split test --output data/benchmarks/generated/mmlu_pro.json
          python scripts/build_benchmark_index.py

      - name: Refresh score snapshots for the site build
        run: python scripts/sync_scores.py

      - name: Build static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R src/. dist/
          cp -R data dist/
          cp robots.txt dist/
          cp sitemap.xml dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '#Force-update-pages') || contains(toJson(github.event.commits), '#Force-update-pages')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  mark-force-update:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '#Force-update-pages') || contains(toJson(github.event.commits), '#Force-update-pages'))
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create bot marker commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "pages updated [skip ci]"
          git push origin HEAD:main
