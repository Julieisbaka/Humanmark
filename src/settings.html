<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Settings</title>
    <link rel='stylesheet' href='style.css'>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css'>
    <script src='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js'></script>
    <script type='module' src='script.js'></script>
</head>

<body data-page='settings'>
    <main class='app-shell'>
        <header class='page-header'>
            <a class='back-link' href='index.html'>← Back to benchmarks</a>
            <div>
                <p class='eyebrow'>Customize</p>
                <h1>Preferences</h1>
            </div>
        </header>

        <section class='panel'>
            <div class='panel-heading'>
                <h2>Question display</h2>
                <p>These settings are stored in your browser.</p>
            </div>

            <form class='stack' data-role='settings-form'>
                <label class='field'>
                    <span>Questions per page</span>
                    <input
                        data-role='setting-questions-per-page'
                        type='number'
                        min='1'
                        max='20'
                        step='1'
                        inputmode='numeric'
                    />
                    <small class='field-help'>Controls how many questions appear per page while taking a benchmark.</small>
                </label>

                <label class='field'>
                    <span>Leaderboard rows before truncation</span>
                    <input
                        data-role='setting-leaderboard-limit'
                        type='number'
                        min='1'
                        max='500'
                        step='1'
                        inputmode='numeric'
                    />
                    <small class='field-help'>Shows this many top models before collapsing the rest behind “Show more models”.</small>
                </label>

                <label class='field field-toggle'>
                    <input
                        data-role='setting-sort-numeric-choices'
                        type='checkbox'
                    />
                    <span>Sort numeric/percent answer choices from least to greatest</span>
                </label>
                <small class='field-help'>Only applies when all choices are numeric-style values (like percentages or amounts).</small>

                <div class='actions-row'>
                    <button class='button' type='submit' data-role='settings-save'>Save settings</button>
                    <button class='button button--ghost' type='button' data-role='settings-reset'>Reset to defaults</button>
                </div>

                <p data-role='settings-status' aria-live='polite'></p>
            </form>
        </section>
    </main>
</body>

</html>
